name: Processar PRD Standard

on:
  workflow_dispatch:
    inputs:
      arquivo_prd_origem:
        description: "Nome do arquivo PRD no repositório de armazenamento"
        required: false
        default: "receita_cuscuz.md"

  repository_dispatch:
    types:
      - jira-card-moved

permissions:
  contents: write

concurrency:
  group: processamento-prd-standard
  cancel-in-progress: false

env:
  REPO_ARMAZENAMENTO: CintiaMiranda2006/Workflow-Armazenamento
  BRANCH_ARMAZENAMENTO: main
  PRD_STANDARD_DESTINO: markdown_vazio.md
  DEFAULT_PRD_ORIGEM: receita_cuscuz.md

jobs:
  processar-prd:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Repositório 2 - Processamento
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir arquivo PRD de origem
        id: definir-prd
        env:
          INPUT_PRD_FILE: ${{ github.event.inputs.arquivo_prd_origem }}
          PAYLOAD_PRD_FILE: ${{ github.event.client_payload.prd_file }}
        run: |
          PRD_ORIGEM="${INPUT_PRD_FILE:-${PAYLOAD_PRD_FILE:-$DEFAULT_PRD_ORIGEM}}"

          echo "PRD de origem definido: $PRD_ORIGEM"
          echo "prd_origem=$PRD_ORIGEM" >> "$GITHUB_OUTPUT"

      - name: Validar existência do PRD Standard no Repositório 2
        run: |
          if [ ! -f "$PRD_STANDARD_DESTINO" ]; then
            echo "Erro: o arquivo $PRD_STANDARD_DESTINO não existe no Repositório 2."
            exit 1
          fi

          echo "Arquivo PRD Standard encontrado: $PRD_STANDARD_DESTINO"

      - name: Buscar PRD do Repositório 1 e sobrescrever PRD Standard
        env:
          PRD_ORIGEM: ${{ steps.definir-prd.outputs.prd_origem }}
        run: |
          RAW_URL="https://raw.githubusercontent.com/${REPO_ARMAZENAMENTO}/${BRANCH_ARMAZENAMENTO}/${PRD_ORIGEM}"

          echo "Buscando PRD no Repositório 1..."
          echo "Arquivo origem: $PRD_ORIGEM"
          echo "Arquivo destino: $PRD_STANDARD_DESTINO"

          curl -L --fail "$RAW_URL" -o "$PRD_STANDARD_DESTINO"

          if [ ! -s "$PRD_STANDARD_DESTINO" ]; then
            echo "Erro: o PRD Standard ficou vazio após o download."
            exit 1
          fi

          echo "PRD Standard sobrescrito com sucesso."
          echo "Prévia do conteúdo:"
          head -n 20 "$PRD_STANDARD_DESTINO"

      - name: Processamento principal do PRD
        run: |
          mkdir -p relatorios

          echo "Iniciando processamento do PRD..."
          echo "Arquivo processado: $PRD_STANDARD_DESTINO" | tee relatorios/processamento-prd.log
          echo "Quantidade de linhas: $(wc -l < "$PRD_STANDARD_DESTINO")" | tee -a relatorios/processamento-prd.log
          echo "Quantidade de caracteres: $(wc -m < "$PRD_STANDARD_DESTINO")" | tee -a relatorios/processamento-prd.log
          echo "Hash SHA256:" | tee -a relatorios/processamento-prd.log
          sha256sum "$PRD_STANDARD_DESTINO" | tee -a relatorios/processamento-prd.log

          echo "" >> relatorios/processamento-prd.log
          echo "Conteúdo processado:" >> relatorios/processamento-prd.log
          cat "$PRD_STANDARD_DESTINO" >> relatorios/processamento-prd.log

          echo "Processamento finalizado com sucesso."

      - name: Limpar PRD Standard após processamento
        if: always()
        run: |
          echo "Limpando o conteúdo do PRD Standard..."
          : > "$PRD_STANDARD_DESTINO"
          echo "PRD Standard limpo com sucesso."

      - name: Salvar limpeza no Repositório 2
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$PRD_STANDARD_DESTINO"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: limpar PRD Standard após processamento"
            git push
          fi

      - name: Publicar relatório do processamento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-processamento-prd
          path: relatorios/