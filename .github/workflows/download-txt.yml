name: Processar todos os PRDs

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - jira-card-moved

permissions:
  contents: write

concurrency:
  group: processamento-prd-standard
  cancel-in-progress: false

env:
  REPO_ARMAZENAMENTO: CintiaMiranda2006/Workflow-Armazenamento
  BRANCH_ARMAZENAMENTO: main
  PRD_STANDARD_DESTINO: markdown_vazio.md

jobs:
  processar-todos-prds:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Repositório 2 - Processamento
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Repositório 1 - Armazenamento
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_ARMAZENAMENTO }}
          ref: ${{ env.BRANCH_ARMAZENAMENTO }}
          path: repo-armazenamento
          persist-credentials: false

      - name: Validar PRD Standard no Repositório 2
        run: |
          if [ ! -f "$PRD_STANDARD_DESTINO" ]; then
            echo "Erro: o arquivo $PRD_STANDARD_DESTINO não existe no Repositório 2."
            exit 1
          fi

          echo "PRD Standard encontrado: $PRD_STANDARD_DESTINO"

      - name: Buscar todos os PRDs do Repositório 1 e processar um por um
        run: |
          mkdir -p relatorios

          echo "Buscando todos os arquivos .md do Repositório 1, ignorando README.md..."

          mapfile -t PRDS < <(find repo-armazenamento -type f -name "*.md" ! -iname "README.md" | sort)

          if [ ${#PRDS[@]} -eq 0 ]; then
            echo "Erro: nenhum PRD .md encontrado no Repositório 1."
            exit 1
          fi

          echo "Total de PRDs encontrados: ${#PRDS[@]}"
          echo ""

          for PRD in "${PRDS[@]}"; do
            NOME_PRD=$(basename "$PRD")
            NOME_RELATORIO="${NOME_PRD%.md}"

            echo "=========================================="
            echo "Processando PRD: $NOME_PRD"
            echo "Arquivo origem: $PRD"
            echo "Arquivo destino: $PRD_STANDARD_DESTINO"
            echo "=========================================="

            cp "$PRD" "$PRD_STANDARD_DESTINO"

            if [ ! -s "$PRD_STANDARD_DESTINO" ]; then
              echo "Erro: o PRD Standard ficou vazio após copiar $NOME_PRD."
              exit 1
            fi

            echo "PRD copiado para o PRD Standard com sucesso."
            echo "Prévia do conteúdo:"
            head -n 10 "$PRD_STANDARD_DESTINO"

            echo ""
            echo "Executando processamento principal..."

            {
              echo "PRD processado: $NOME_PRD"
              echo "Arquivo origem: $PRD"
              echo "Arquivo destino temporário: $PRD_STANDARD_DESTINO"
              echo "Quantidade de linhas: $(wc -l < "$PRD_STANDARD_DESTINO")"
              echo "Quantidade de caracteres: $(wc -m < "$PRD_STANDARD_DESTINO")"
              echo "Hash SHA256:"
              sha256sum "$PRD_STANDARD_DESTINO"
              echo ""
              echo "Conteúdo processado:"
              cat "$PRD_STANDARD_DESTINO"
            } > "relatorios/${NOME_RELATORIO}-processamento.log"

            echo "Processamento finalizado para: $NOME_PRD"
            echo ""
          done

          echo "Todos os PRDs foram processados."

      - name: Limpar PRD Standard após todos os processamentos
        if: always()
        run: |
          echo "Limpando o conteúdo do PRD Standard..."
          : > "$PRD_STANDARD_DESTINO"
          echo "PRD Standard limpo com sucesso."

      - name: Salvar limpeza no Repositório 2
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$PRD_STANDARD_DESTINO"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "chore: limpar PRD Standard após processamento"
            git push
          fi

      - name: Publicar relatórios dos PRDs processados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-processamento-prds
          path: relatorios/