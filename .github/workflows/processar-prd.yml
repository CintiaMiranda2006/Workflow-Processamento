name: Processar PRD

on:
  workflow_call:
    inputs:
      nome_prd:
        description: "Nome do arquivo .md que será buscado no repositório de armazenamento"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  REPO_ARMAZENAMENTO: CintiaMiranda2006/Workflow-Armazenamento
  BRANCH_ARMAZENAMENTO: main
  BRANCH_BASE_PR: main
  PRD_STANDARD_DESTINO: markdown_vazio.md
  PASTA_PRD_GERADO: prds-gerados

jobs:
  processar-prd:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Repositório 2 - Processamento
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar Repositório 1 - Armazenamento
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_ARMAZENAMENTO }}
          ref: ${{ env.BRANCH_ARMAZENAMENTO }}
          path: repo-armazenamento
          persist-credentials: false

      - name: Definir nomes do PRD
        id: definir-prd
        shell: bash
        run: |
          NOME_PRD="${{ inputs.nome_prd }}"
          NOME_BASE="${NOME_PRD%.md}"
          ARQUIVO_GERADO="${NOME_BASE}-prd-gerado.md"
          CAMINHO_ARQUIVO_GERADO="${{ env.PASTA_PRD_GERADO }}/${ARQUIVO_GERADO}"

          BRANCH_SLUG=$(echo "$NOME_BASE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')

          if [ -z "$BRANCH_SLUG" ]; then
            BRANCH_SLUG="prd"
          fi

          echo "Arquivo solicitado: $NOME_PRD"
          echo "Arquivo gerado no Repositório 2: $CAMINHO_ARQUIVO_GERADO"
          echo "Slug da branch do Pull Request: $BRANCH_SLUG"

          echo "nome_prd=$NOME_PRD" >> "$GITHUB_OUTPUT"
          echo "nome_base=$NOME_BASE" >> "$GITHUB_OUTPUT"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"
          echo "caminho_arquivo_gerado=$CAMINHO_ARQUIVO_GERADO" >> "$GITHUB_OUTPUT"

      - name: Validar PRD Standard no Repositório 2
        run: |
          if [ ! -f "$PRD_STANDARD_DESTINO" ]; then
            echo "Erro: o arquivo $PRD_STANDARD_DESTINO não existe no Repositório 2."
            exit 1
          fi

          echo "PRD Standard encontrado: $PRD_STANDARD_DESTINO"

      - name: Buscar PRD do card
        id: buscar-prd
        shell: bash
        run: |
          NOME_PRD="${{ steps.definir-prd.outputs.nome_prd }}"

          echo "Buscando apenas o arquivo informado no título do card: $NOME_PRD"

          mapfile -t PRDS < <(find repo-armazenamento -type f -name "$NOME_PRD" ! -iname "README.md" | sort)

          if [ ${#PRDS[@]} -eq 0 ]; then
            echo "Erro: arquivo $NOME_PRD não encontrado no Repositório 1."
            echo "Arquivos .md disponíveis:"
            find repo-armazenamento -type f -name "*.md" ! -iname "README.md" -printf "%f\n" | sort
            exit 1
          fi

          if [ ${#PRDS[@]} -gt 1 ]; then
            echo "Erro: mais de um arquivo com o nome $NOME_PRD foi encontrado."
            printf '%s\n' "${PRDS[@]}"
            exit 1
          fi

          PRD="${PRDS[0]}"

          echo "PRD encontrado: $PRD"
          echo "caminho_prd_origem=$PRD" >> "$GITHUB_OUTPUT"

      - name: Copiar PRD para arquivo standard temporário
        shell: bash
        run: |
          PRD="${{ steps.buscar-prd.outputs.caminho_prd_origem }}"
          NOME_PRD="${{ steps.definir-prd.outputs.nome_prd }}"

          echo "=========================================="
          echo "Copiando PRD: $NOME_PRD"
          echo "Arquivo origem: $PRD"
          echo "Arquivo temporário: $PRD_STANDARD_DESTINO"
          echo "=========================================="

          cp "$PRD" "$PRD_STANDARD_DESTINO"

          if [ ! -s "$PRD_STANDARD_DESTINO" ]; then
            echo "Erro: o PRD Standard ficou vazio após copiar $NOME_PRD."
            exit 1
          fi

          echo "PRD copiado para o arquivo temporário com sucesso."
          echo "Prévia do conteúdo:"
          head -n 10 "$PRD_STANDARD_DESTINO"

      - name: Gerar novo arquivo com conteúdo do PRD puxado
        shell: bash
        run: |
          CAMINHO_ARQUIVO_GERADO="${{ steps.definir-prd.outputs.caminho_arquivo_gerado }}"

          mkdir -p "$(dirname "$CAMINHO_ARQUIVO_GERADO")"
          cp "$PRD_STANDARD_DESTINO" "$CAMINHO_ARQUIVO_GERADO"

          if [ ! -s "$CAMINHO_ARQUIVO_GERADO" ]; then
            echo "Erro: o arquivo gerado ficou vazio."
            exit 1
          fi

          echo "Arquivo gerado com o conteúdo do PRD: $CAMINHO_ARQUIVO_GERADO"

      - name: Gerar relatório do processamento
        shell: bash
        run: |
          mkdir -p relatorios

          NOME_PRD="${{ steps.definir-prd.outputs.nome_prd }}"
          NOME_BASE="${{ steps.definir-prd.outputs.nome_base }}"
          PRD="${{ steps.buscar-prd.outputs.caminho_prd_origem }}"
          CAMINHO_ARQUIVO_GERADO="${{ steps.definir-prd.outputs.caminho_arquivo_gerado }}"

          {
            echo "PRD processado: $NOME_PRD"
            echo "Arquivo origem: $PRD"
            echo "Arquivo gerado: $CAMINHO_ARQUIVO_GERADO"
            echo "Quantidade de linhas: $(wc -l < "$CAMINHO_ARQUIVO_GERADO")"
            echo "Quantidade de caracteres: $(wc -m < "$CAMINHO_ARQUIVO_GERADO")"
            echo "Hash SHA256:"
            sha256sum "$CAMINHO_ARQUIVO_GERADO"
            echo ""
            echo "Conteúdo processado:"
            cat "$CAMINHO_ARQUIVO_GERADO"
          } > "relatorios/${NOME_BASE}-processamento.log"

          echo "Processamento finalizado para: $NOME_PRD"

      - name: Limpar PRD Standard temporário
        if: always()
        run: |
          echo "Limpando o conteúdo do PRD Standard temporário..."
          : > "$PRD_STANDARD_DESTINO"
          echo "PRD Standard temporário limpo com sucesso."

      - name: Criar Pull Request com o arquivo gerado
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          NOME_PRD: ${{ steps.definir-prd.outputs.nome_prd }}
          NOME_BASE: ${{ steps.definir-prd.outputs.nome_base }}
          BRANCH_SLUG: ${{ steps.definir-prd.outputs.branch_slug }}
          CAMINHO_ARQUIVO_GERADO: ${{ steps.definir-prd.outputs.caminho_arquivo_gerado }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_PR="automacao/prd-${BRANCH_SLUG}-${GITHUB_RUN_ID}"

          echo "Criando branch para o Pull Request: $BRANCH_PR"
          git checkout -b "$BRANCH_PR"

          git add "$CAMINHO_ARQUIVO_GERADO"

          if git diff --cached --quiet -- "$CAMINHO_ARQUIVO_GERADO"; then
            echo "Nenhuma alteração no arquivo gerado. Pull Request não será criado."
            exit 0
          fi

          git commit -m "feat: gerar arquivo do PRD $NOME_PRD"
          git push --set-upstream origin "$BRANCH_PR"

          PR_URL=$(gh pr create \
            --base "$BRANCH_BASE_PR" \
            --head "$BRANCH_PR" \
            --title "feat: gerar PRD $NOME_PRD" \
            --body "Este Pull Request foi aberto automaticamente pelo GitHub Actions.\n\nArquivo processado: \`$NOME_PRD\`\nArquivo gerado: \`$CAMINHO_ARQUIVO_GERADO\`\n\nO conteúdo foi gerado em uma branch separada para revisão do dono do repositório antes do merge na branch principal.")

          echo "Pull Request criado: $PR_URL"

      - name: Publicar relatório do PRD processado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-processamento-prd
          path: relatorios/
